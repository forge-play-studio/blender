name: headless

# Native Linux build of THIS commit, headless + Cycles, for the fps-agent
# sandbox's resident Blender.
#
# Why this exists: the browser runs this same tree compiled to wasm
# (forge-play-studio/blender-wasm). Scene sync between the two is done by
# exchanging .blend FILES, which is only sound when both sides share one DNA
# subversion — an official daily build is 17 subversions ahead of our base and
# would silently drop data. So the resident is built from the exact commit the
# wasm build uses.
#
# Headless (no GHOST/X11) because the sandbox image has no X libraries and the
# resident only ever runs `blender --background`. Cycles stays ON: full-size
# renders are the agent's feedback signal.

on:
  workflow_dispatch:
  push:
    tags: ['linux-v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-22.04, NOT ubuntu-latest. The binary has to run on the sandbox
    # image, which is Debian 12 (glibc 2.36); a 24.04 runner produces one that
    # needs GLIBC_2.38 and dies with "version `GLIBC_2.38' not found" — glibc is
    # forward, not backward, compatible. 22.04 is glibc 2.35, comfortably below.
    # The floor is asserted after the build, so this can never regress silently.
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      # The precompiled library submodule plus the object tree is tens of GB;
      # a stock runner has ~14 GB free.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          # gcc-14 is not in 22.04's own archive; Blender 5.3 requires >= 14
          # (or clang >= 17, which 22.04 also lacks).
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git git-lfs python3 \
            gcc-14 g++-14 \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libegl-dev libwayland-dev \
            libdbus-1-dev linux-libc-dev \
            libsm6 libice6 libxext6 libxrender1
          git lfs install
          # Blender 5.3 refuses to configure below GCC 14; the runner's default
          # is 13.3.
          gcc-14 --version | head -1

      # Full clone: make_update drives submodules and needs real git history.
      - name: Checkout Blender (this fork)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # release/datafiles/startup.blend and friends are LFS objects, and CMake
      # refuses to configure against the pointer stubs ("Detected incomplete
      # startup blend"). A GitHub fork does NOT carry the upstream's LFS
      # storage, so checkout's own `lfs: true` fails against this remote.
      # Blender's tooling solves that with a fallback remote at
      # projects.blender.org; do the same by hand, since make_update would also
      # try to move the working tree off this commit.
      - name: Fetch Git LFS from the Blender fallback remote
        run: |
          git lfs install --local
          git config lfs.remote.searchall true
          git remote add lfs-fallback https://projects.blender.org/blender/blender.git || true
          git lfs fetch lfs-fallback
          git lfs pull
          SIZE=$(stat -c%s release/datafiles/startup.blend)
          echo "startup.blend: $SIZE bytes"
          test "$SIZE" -gt 1024 || { echo "::error::startup.blend is still an LFS pointer"; exit 1; }

      # Pulls lib/linux_x64 (the precompiled VFX-platform dependency set).
      # --no-blender: the checkout above already IS the tree we want; letting
      # make_update pull would move us off this commit.
      - name: Fetch precompiled libraries
        run: |
          ./build_files/utils/make_update.py --no-blender
          du -sh lib/linux_x64 || true
          df -h /

      - name: Configure (headless + Cycles)
        run: |
          export CC=gcc-14 CXX=g++-14
          cmake -S . -B ../build -G Ninja \
            -C build_files/cmake/config/blender_headless.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_EMBREE=ON \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
            -DWITH_OPENIMAGEDENOISE=ON \
            -DWITH_PYTHON=ON \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_DRACO=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/../install

      - name: Build + install
        run: |
          ninja -C ../build -j $(nproc) install
          df -h /

      # Smoke test in the shape the sandbox uses it: no window system, Python on
      # the main thread, Cycles present, and a .blend actually written.
      - name: Smoke test (headless)
        run: |
          BIN=$(find ../install -maxdepth 3 -name blender -type f | head -1)
          echo "binary: $BIN"
          # The definitive dependency list for whoever has to run this thing.
          echo "--- shared libraries ---"
          ldd "$BIN" | sort
          echo "--- unresolved ---"
          ldd "$BIN" | grep -i "not found" && { echo "::error::missing shared libraries"; exit 1; } || echo "none"
          # The binary must RUN on the sandbox image (Debian 12 / glibc 2.36).
          # Assert the floor here: a runner bump that raises the requirement is a
          # build failure, not a sandbox that cannot start Blender.
          echo "--- highest GLIBC symbol required ---"
          MAXGLIBC=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "$MAXGLIBC (ceiling: GLIBC_2.36)"
          printf '%s\n' "$MAXGLIBC" "GLIBC_2.36" | sort -VC \
            || { echo "::error::$MAXGLIBC exceeds the sandbox image's glibc 2.36"; exit 1; }
          # The X/GL libraries it still needs at runtime. WITH_HEADLESS only drops
          # GHOST windowing; the GPU module still links libGL. deploy.ts installs
          # these into the sandbox image -- keep the two lists in step.
          echo "--- runtime library names (deploy.ts must provide these) ---"
          objdump -p "$BIN" | awk '/NEEDED/{print $2}' | sort
          "$BIN" --version
          # Cycles is NOT in RenderSettings' RNA engine enum -- that enum only
          # carries the engines compiled into the DNA, and Cycles registers
          # itself from the `cycles` add-on at runtime. An official build with
          # Cycles reports exactly ['BLENDER_EEVEE'] there too, so asserting on
          # it fails on a perfectly good binary. Assign the engine and render
          # 32x32 instead: that exercises the add-on, the RenderEngine
          # registration and the kernel in one go.
          "$BIN" --background --factory-startup --python-expr "import bpy, addon_utils, os; print('CYCLES_ADDON', addon_utils.check('cycles')); bpy.context.scene.render.engine='CYCLES'; assert bpy.context.scene.render.engine=='CYCLES', 'Cycles missing'; bpy.context.scene.cycles.samples=1; bpy.context.scene.render.resolution_x=32; bpy.context.scene.render.resolution_y=32; bpy.context.scene.render.filepath='/tmp/cyc.png'; bpy.ops.render.render(write_still=True); print('CYCLES RENDER BYTES', os.path.getsize('/tmp/cyc.png')); print('BLENDER_FILE_VERSION', bpy.data.version); bpy.ops.wm.save_as_mainfile(filepath='/tmp/smoke.blend', check_existing=False, copy=True); print('SMOKE OK')"
          test -s /tmp/cyc.png
          test -s /tmp/smoke.blend

      - name: Package
        id: pkg
        run: |
          SHORT=$(git rev-parse --short HEAD)
          ROOT=$(find ../install -maxdepth 2 -name blender -type f -printf '%h\n' | head -1)
          echo "packaging from: $ROOT"
          tar -C "$ROOT" -cJf "headless-${SHORT}.tar.xz" .
          ls -la headless-*.tar.xz
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ steps.pkg.outputs.short }}
          path: headless-*.tar.xz
          if-no-files-found: error

      # Rolling release so the sandbox template can fetch a stable URL.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: headless-latest
          name: Linux headless (rolling)
          prerelease: true
          files: headless-*.tar.xz
